# ================================================
# StockFlow — Docker Compose
# Orquestra: app (PHP+Apache) + db (MySQL)
# ================================================
version: "3.9"

services:

  # ── Banco de Dados MySQL ──────────────────────
  db:
    image: mysql:8.0
    container_name: stockflow_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - stockflow_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Aplicação PHP + Apache ────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockflow_app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stockflow_net
    volumes:
      - app_logs:/var/log/apache2

# ── Volumes ───────────────────────────────────
volumes:
  db_data:
    driver: local
  app_logs:
    driver: local

# ── Rede ──────────────────────────────────────
networks:
  stockflow_net:
    driver: bridge
